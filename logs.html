<!DOCTYPE html>
<html>
<head>
    <title>Logs - ANPR</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: left; }
        img { width: 100px; }
        a { color: #03a9f4; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Detection Logs</h1>
    <table>
        <tr><th>Image</th><th>Plate</th><th>Timestamp</th><th>Camera</th></tr>
        {% for row in data %}
        <tr>
            <td><img src="/static/uploads/{{ row[1] }}"></td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
