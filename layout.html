<!DOCTYPE html>
<html>
<head>
    <title>GuardView ANPR</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar {
            background-color: #1e293b;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar a {
            color: #93c5fd;
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .navbar .logo {
            font-size: 20px;
            font-weight: bold;
            color: #60a5fa;
        }
        .content {
            padding: 20px;
        }
        .btn {
            background-color: #2563eb;
            border: none;
            padding: 6px 12px;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table.data-table th, table.data-table td {
            border: 1px solid #334155;
            padding: 8px;
            text-align: left;
        }
        table.data-table th {
            background-color: #1e293b;
        }
        table.data-table tr:nth-child(even) {
            background-color: #1c1f2a;
        }
        input, select {
            padding: 5px;
            margin-top: 5px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: white;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">🚓 GuardView ANPR</div>
    <div>
        <a href="/dashboard">Home</a>
        <a href="/report">Report</a>
        <a href="/settings">Settings</a>
        <a href="/about">About</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
