<!DOCTYPE html>
<html>
<head>
    <title>Login - GuardView ANPR System</title>
    <style>
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        .login-box img {
            width: 80px;
            margin-bottom: 15px;
        }
        .login-box h2 {
            margin-bottom: 20px;
            color: #60a5fa;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background-color: #334155;
            color: white;
            border: none;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2563eb;
        }
        .forgot-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.9em;
            color: #60a5fa;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }
        .modal-content input {
            background: #475569;
        }
        .close {
            color: #ccc;
            float: right;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="/static/logo.png" alt="GuardView Logo">
        <h2>🔐 Login</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <select name="role" required>
                <option value="">Select Role</option>
                <option value="admin">Admin</option>
                <option value="viewer">Viewer</option>
            </select>
            <button type="submit">Login</button>
        </form>
        <div class="forgot-link" onclick="document.getElementById('forgotModal').style.display='flex'">Forgot password?</div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('forgotModal').style.display='none'">&times;</span>
            <h3>Reset Password</h3>
            <form method="POST" action="/forgot_password">
                <input type="text" name="username" placeholder="Enter your username" required><br><br>
                <button type="submit">Send Reset Link</button>
            </form>
        </div>
    </div>

    <script>
        window.onclick = function(event) {
            var modal = document.getElementById('forgotModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
